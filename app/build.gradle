plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Релизная подпись: читаем keystore.properties (в .gitignore, в репо не попадает)
def ksProps = new Properties()
def ksPropsFile = rootProject.file("keystore.properties")
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.nex.vpn'
    compileSdk 36

    defaultConfig {
        applicationId "com.nex.vpn"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true; buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    // Xray core (vless/reality) — AAR кладём в app/libs/ (собрать/скачать отдельно)
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // DoH
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // корутины
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
